<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<meta name="Description" content="Enter your description here"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<title>Exemplo 26 - HTML CSS</title>
</head>
<body>
    <div class="container-sm">
        <h1>Exemplo 26 HTML CSS - Vinculação Externa</h1>
        <div class="card mt-4">
            <div class="card-header text-white bg-primary" >
                 Cadastro de Pessoa
            </div>
            <div class="card-body">
                <div>
                    <label for="">CPF</label>
                    <input type="text" name="" id="" class="form-control">
                </div>
                <div>
                    <label for="">Nome</label>
                    <input type="text" name="" id="" class="form-control">
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="">Nome da Mãe</label>
                        <input type="text" name="" id="" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Nome da Pai</label>
                        <input type="text" name="" id="" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-4">
                        <label for="">Data Nascimento</label>
                        <input type="datetime" name="" id="" class="form-control">
                    </div>
                    <div class="col-4">
                        <label for="">Telefone</label>
                        <input type="tel" name="" id="" class="form-control">
                    </div>
                    <div class="col-4">
                        <label for="">e-mail</label>
                        <input type="e-mail" name="" id="" class="form-control">
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="button">Salvar</button>
                    <button class="btn btn-primary" type="button">Cancelar</button>
                </div>
            </div>

        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.0/js/bootstrap.min.js"></script>
</body>
</html>
